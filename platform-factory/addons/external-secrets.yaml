apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: synthetic-showcase
  annotations:
    showcase.platform.example.com/provider: fake-test-data-only
spec:
  provider:
    fake:
      data:
        - key: /showcase/application/api-key
          value: synthetic-demo-value
          version: v1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-application
  namespace: team-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: synthetic-showcase
  target:
    name: example-application
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: /showcase/application/api-key
        version: v1
